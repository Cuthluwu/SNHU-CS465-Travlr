    "hbs": "^4.2.0",
    "http-errors": "~1.6.3",
    "morgan": "~1.9.1"
  }
}
EOF
                ;;

              module4)
                rm -rf "$snap/app_admin" "$snap/postman" "$snap/docs" "$snap/screenshots"
                rm -rf "$snap/app_api/controllers" "$snap/app_api/routes" "$snap/app_api/config"
                rm -f "$snap/app_api/models/user.js" "$snap"/MODULE5_NOTES.txt "$snap"/MODULE6_NOTES.txt "$snap"/MODULE6_RUBRIC_CHECKLIST.txt "$snap"/MODULE7_NOTES.txt "$snap/FINAL_PROJECT_CHECKLIST.txt" "$snap/package-lock.json"
                sed -i "/require('\.\/user');/d" "$snap/app_api/models/db.js"
                cat > "$snap/app_server/controllers/travel.js" <<'EOF'
const fs = require('fs');
const path = require('path');
const tripsPath = path.join(__dirname, '..', '..', 'data', 'trips.json');
const travel = (req, res) => {
  const trips = JSON.parse(fs.readFileSync(tripsPath, 'utf8'));
  res.render('travel', { title: 'Travlr Getaways', trips });
};
module.exports = { travel };
EOF
                python - <<'PY'
from pathlib import Path
p=Path('/tmp/module4/app.js')
s=p.read_text()
s=s.replace("var passport = require('passport');\n", "")
s=s.replace("require('./app_api/config/passport');\n", "")
s=s.replace("var apiRouter = require('./app_api/routes/index');\n", "")
s=s.replace("app.use(passport.initialize());\n", "")
start=s.find("// The Angular admin application runs on port 4200")
end=s.find("// Customer-facing routes.")
if start != -1 and end != -1: s=s[:start]+s[end:]
s=s.replace("app.use('/api', apiRouter);\n", "")
start=s.find("// Catch authentication errors cleanly")
end=s.find("// Catch 404 and forward")
if start != -1 and end != -1: s=s[:start]+s[end:]
p.write_text(s)
PY
                cat > "$snap/package.json" <<'EOF'
{
  "name": "travlr",
  "version": "0.0.0",
  "private": true,
  "scripts": { "start": "node ./bin/www", "seed": "node ./app_api/models/seed.js" },
  "dependencies": {
    "cookie-parser": "~1.4.4",
    "debug": "~2.6.9",
    "dotenv": "^16.4.5",
    "express": "^4.21.2",
    "hbs": "^4.2.0",
    "http-errors": "~1.6.3",
    "mongoose": "8.5.3",
    "morgan": "~1.9.1"
  }
}
EOF
                ;;

              module5)
                rm -rf "$snap/app_admin" "$snap/docs" "$snap/screenshots" "$snap/app_api/config"
                rm -f "$snap/app_api/models/user.js" "$snap"/MODULE6_NOTES.txt "$snap"/MODULE6_RUBRIC_CHECKLIST.txt "$snap"/MODULE7_NOTES.txt "$snap/FINAL_PROJECT_CHECKLIST.txt" "$snap/postman/Travlr_Module6.postman_collection.json" "$snap/postman/Travlr_Module7_Security.postman_collection.json" "$snap/package-lock.json"
                sed -i "/require('\.\/user');/d" "$snap/app_api/models/db.js"
                cat > "$snap/app_api/routes/index.js" <<'EOF'
const express = require('express');
const router = express.Router();
const tripsController = require('../controllers/trips');
router.route('/trips').get(tripsController.tripsList).post(tripsController.tripsAddTrip);
router.route('/trips/:tripCode')
  .get(tripsController.tripsFindByCode)
  .put(tripsController.tripsUpdateTrip)
  .delete(tripsController.tripsDeleteTrip);
module.exports = router;
EOF
                python - <<'PY'
from pathlib import Path
p=Path('/tmp/module5/app.js')
s=p.read_text()
s=s.replace("var passport = require('passport');\n", "")
s=s.replace("require('./app_api/config/passport');\n", "")
s=s.replace("app.use(passport.initialize());\n", "")
s=s.replace("Origin, X-Requested-With, Content-Type, Accept, Authorization", "Origin, X-Requested-With, Content-Type, Accept")
start=s.find("// Catch authentication errors cleanly")
end=s.find("// Catch 404 and forward")
if start != -1 and end != -1: s=s[:start]+s[end:]
p.write_text(s)
PY
                cat > "$snap/package.json" <<'EOF'
{
  "name": "travlr",
  "version": "0.0.0",
  "private": true,
  "scripts": { "start": "node ./bin/www", "seed": "node ./app_api/models/seed.js" },
  "dependencies": {
    "cookie-parser": "~1.4.4", "debug": "~2.6.9", "dotenv": "^16.4.5",
    "express": "^4.21.2", "hbs": "^4.2.0", "http-errors": "~1.6.3",
    "mongoose": "8.5.3", "morgan": "~1.9.1"
  }
}
EOF
                ;;

              module6)
                rm -rf "$snap/docs" "$snap/screenshots" "$snap/app_api/config" "$snap/app_admin/src/app/login" "$snap/app_admin/src/app/navbar" "$snap/app_admin/src/app/utils"
                rm -f "$snap/app_api/models/user.js" "$snap/app_api/controllers/authentication.js" "$snap/app_admin/src/app/storage.ts" "$snap/app_admin/src/app/models/user.ts" "$snap/app_admin/src/app/models/auth-response.ts" "$snap/app_admin/src/app/services/authentication.service.ts" "$snap/app_admin/src/app/services/authentication.service.spec.ts" "$snap/MODULE7_NOTES.txt" "$snap/FINAL_PROJECT_CHECKLIST.txt" "$snap/postman/Travlr_Module7_Security.postman_collection.json" "$snap/package-lock.json"
                sed -i "/require('\.\/user');/d" "$snap/app_api/models/db.js"
                cat > "$snap/app_api/routes/index.js" <<'EOF'
const express = require('express');
const router = express.Router();
const tripsController = require('../controllers/trips');
router.route('/trips').get(tripsController.tripsList).post(tripsController.tripsAddTrip);
router.route('/trips/:tripCode')
  .get(tripsController.tripsFindByCode)
  .put(tripsController.tripsUpdateTrip)
  .delete(tripsController.tripsDeleteTrip);
module.exports = router;
EOF
                python - <<'PY'
from pathlib import Path
p=Path('/tmp/module6/app.js')
s=p.read_text()
s=s.replace("var passport = require('passport');\n", "")
s=s.replace("require('./app_api/config/passport');\n", "")
s=s.replace("app.use(passport.initialize());\n", "")
s=s.replace("Origin, X-Requested-With, Content-Type, Accept, Authorization", "Origin, X-Requested-With, Content-Type, Accept")
