name: Rebuild CS 465 course branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-module-branches.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build module checkpoints from the completed project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/final-source
          mkdir -p /tmp/final-source
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='.env' --exclude='node_modules/' ./ /tmp/final-source/

          write_branch_readme() {
            local dir="$1"
            local branch="$2"
            local focus="$3"
            cat > "$dir/README.md" <<EOF
# Travlr Getaways — ${branch}

**Madison Parker · SNHU CS 465: Full Stack Development**

> Course checkpoint branch. The completed application and final portfolio documentation are maintained on [main](https://github.com/Cuthluwu/SNHU-CS465-Travlr) and `final`.

## Focus

**${focus}**

This branch preserves the project structure used for this stage of the course. Later course layers are intentionally removed here so the progression from the Express customer site to the authenticated Angular/MongoDB application can be reviewed clearly.

## Course Progression

| Branch | Focus |
|---|---|
| module1 | Express and static customer site |
| module2 | MVC and Handlebars |
| module3 | JSON-driven trip rendering |
| module4 | MongoDB and Mongoose |
| module5 | REST API |
| module6 | Angular SPA and CRUD |
| module7 | JWT authentication and protected endpoints |
| final | Completed portfolio |
EOF
          }

          make_snapshot() {
            local branch="$1"
            local focus="$2"
            local snap="/tmp/$branch"
            rm -rf "$snap"
            mkdir -p "$snap"
            rsync -a /tmp/final-source/ "$snap/"

            case "$branch" in
              module1)
                rm -rf "$snap/app_server" "$snap/app_api" "$snap/app_admin" "$snap/data" "$snap/postman" "$snap/docs" "$snap/screenshots"
                rm -f "$snap"/MODULE*_NOTES.txt "$snap"/MODULE*_RUBRIC_CHECKLIST.txt "$snap/FINAL_PROJECT_CHECKLIST.txt "$snap/.env.example" "$snap/package-lock.json"
                cat > "$snap/app.js" <<'EOF'
const express = require('express');
const path = require('path');

const app = express();
app.use(express.static(path.join(__dirname, 'public')));

module.exports = app;
EOF
                cat > "$snap/package.json" <<'EOF'
{
  "name": "travlr",
  "version": "0.0.0",
  "private": true,
  "scripts": { "start": "node ./bin/www" },
  "dependencies": {
    "debug": "~2.6.9",
    "express": "^4.21.2"
  }
}
EOF
                ;;

              module2)
                rm -rf "$snap/app_api" "$snap/app_admin" "$snap/data" "$snap/postman" "$snap/docs" "$snap/screenshots"
                rm -f "$snap"/MODULE3_NOTES.txt "$snap"/MODULE4_NOTES.txt "$snap"/MODULE5_NOTES.txt "$snap"/MODULE6_NOTES.txt "$snap"/MODULE6_RUBRIC_CHECKLIST.txt "$snap"/MODULE7_NOTES.txt "$snap/FINAL_PROJECT_CHECKLIST.txt" "$snap/.env.example" "$snap/package-lock.json"
                cat > "$snap/app_server/controllers/travel.js" <<'EOF'
const travel = (req, res) => {
  res.render('travel', { title: 'Travlr Getaways', trips: [] });
};
module.exports = { travel };
EOF
                cat > "$snap/app.js" <<'EOF'
const createError = require('http-errors');
const express = require('express');
const path = require('path');
const cookieParser = require('cookie-parser');
const logger = require('morgan');
const hbs = require('hbs');
const indexRouter = require('./app_server/routes/index');
const usersRouter = require('./app_server/routes/users');
const travelRouter = require('./app_server/routes/travel');
const app = express();
app.set('views', path.join(__dirname, 'app_server', 'views'));
app.set('view engine', 'hbs');
hbs.registerPartials(path.join(__dirname, 'app_server', 'views', 'partials'));
app.use(logger('dev'));
app.use(express.json());
app.use(express.urlencoded({ extended: false }));
app.use(cookieParser());
app.use(express.static(path.join(__dirname, 'public')));
app.use('/', indexRouter);
app.use('/users', usersRouter);
app.use('/travel', travelRouter);
app.use((req, res, next) => next(createError(404)));
app.use((err, req, res, next) => {
  res.locals.message = err.message;
  res.locals.error = req.app.get('env') === 'development' ? err : {};
  res.status(err.status || 500);
  res.render('error');
});
module.exports = app;
EOF
                cat > "$snap/package.json" <<'EOF'
{
  "name": "travlr",
  "version": "0.0.0",
  "private": true,
  "scripts": { "start": "node ./bin/www" },
  "dependencies": {
    "cookie-parser": "~1.4.4",
    "debug": "~2.6.9",
    "express": "^4.21.2",
    "hbs": "^4.2.0",
    "http-errors": "~1.6.3",
    "morgan": "~1.9.1"
  }
}
EOF
                ;;

              module3)
                rm -rf "$snap/app_api" "$snap/app_admin" "$snap/postman" "$snap/docs" "$snap/screenshots"
                rm -f "$snap"/MODULE4_NOTES.txt "$snap"/MODULE5_NOTES.txt "$snap"/MODULE6_NOTES.txt "$snap"/MODULE6_RUBRIC_CHECKLIST.txt "$snap"/MODULE7_NOTES.txt "$snap/FINAL_PROJECT_CHECKLIST.txt" "$snap/.env.example" "$snap/package-lock.json"
                cat > "$snap/app_server/controllers/travel.js" <<'EOF'
const fs = require('fs');
const path = require('path');
const tripsPath = path.join(__dirname, '..', '..', 'data', 'trips.json');
const travel = (req, res) => {
  const trips = JSON.parse(fs.readFileSync(tripsPath, 'utf8'));
  res.render('travel', { title: 'Travlr Getaways', trips });
};
module.exports = { travel };
EOF
                cat > "$snap/app.js" <<'EOF'
