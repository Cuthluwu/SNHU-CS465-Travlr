                python - <<'PY'
from pathlib import Path
root=Path('/tmp/module6/app_admin/src/app')
(root/'app.component.ts').write_text("""import { Component } from '@angular/core';\nimport { RouterOutlet } from '@angular/router';\n@Component({ selector: 'app-root', standalone: true, imports: [RouterOutlet], templateUrl: './app.component.html', styleUrl: './app.component.css' })\nexport class AppComponent { title = 'Travlr Getaways Admin'; }\n""")
(root/'app.component.html').write_text("""<header class=\"bg-dark text-white py-3\"><div class=\"container\"><h1 class=\"h4 mb-0\">Travlr Getaways Admin</h1></div></header>\n<main class=\"container py-4\"><router-outlet></router-outlet></main>\n""")
(root/'app.routes.ts').write_text("""import { Routes } from '@angular/router';\nimport { AddTripComponent } from './add-trip/add-trip.component';\nimport { EditTripComponent } from './edit-trip/edit-trip.component';\nimport { TripListingComponent } from './trip-listing/trip-listing.component';\nexport const routes: Routes = [{ path: '', component: TripListingComponent }, { path: 'add-trip', component: AddTripComponent }, { path: 'edit-trip', component: EditTripComponent }, { path: '**', redirectTo: '' }];\n""")
(root/'app.config.ts').write_text("""import { ApplicationConfig } from '@angular/core';\nimport { provideHttpClient } from '@angular/common/http';\nimport { provideRouter } from '@angular/router';\nimport { routes } from './app.routes';\nexport const appConfig: ApplicationConfig = { providers: [provideRouter(routes), provideHttpClient()] };\n""")
svc=root/'services/trip-data.service.ts'
s=svc.read_text()
s=s.replace("import { HttpClient, HttpParams } from '@angular/common/http';", "import { HttpClient } from '@angular/common/http';")
s=s.replace("import { AuthResponse } from '../models/auth-response';\n", "").replace("import { User } from '../models/user';\n", "")
pos=s.find("  // Authentication endpoints")
if pos != -1: s=s[:pos]+"}\n"
svc.write_text(s)
for name in ['add-trip/add-trip.component.ts','edit-trip/edit-trip.component.ts','trip-listing/trip-listing.component.ts','trip-card/trip-card.component.ts']:
    p=root/name
    s=p.read_text()
    s=s.replace("import { AuthenticationService } from '../services/authentication.service';\n", "")
    s=s.replace(",\n    private authenticationService: AuthenticationService", "")
    s=s.replace(",\n    private authenticationService: AuthenticationService\n", "\n")
    s=s.replace("    private authenticationService: AuthenticationService\n", "")
    s=s.replace("  public isLoggedIn(): boolean {\n    return this.authenticationService.isLoggedIn();\n  }\n\n", "")
    start=s.find("    if (!this.authenticationService.isLoggedIn()) {")
    if start != -1:
        end=s.find("    }\n\n", start)
        if end != -1: s=s[:start]+s[end+7:]
    p.write_text(s)
for name in ['trip-listing/trip-listing.component.html','trip-card/trip-card.component.html']:
    p=root/name
    s=p.read_text().replace(' *ngIf="isLoggedIn()"','')
    p.write_text(s)
PY
                cat > "$snap/package.json" <<'EOF'
{
  "name": "travlr", "version": "0.0.0", "private": true,
  "scripts": { "start": "node ./bin/www", "seed": "node ./app_api/models/seed.js" },
  "dependencies": {
    "cookie-parser": "~1.4.4", "debug": "~2.6.9", "dotenv": "^16.4.5",
    "express": "^4.21.2", "hbs": "^4.2.0", "http-errors": "~1.6.3",
    "mongoose": "8.5.3", "morgan": "~1.9.1"
  }
}
EOF
                ;;

              module7)
                rm -rf "$snap/docs" "$snap/screenshots"
                ;;
            esac

            write_branch_readme "$snap" "$branch" "$focus"
          }

          make_snapshot module1 "Express foundation and static customer-facing website"
          make_snapshot module2 "MVC routing, controllers, Handlebars views, and reusable partials"
          make_snapshot module3 "JSON-driven trip data and dynamic Handlebars rendering"
          make_snapshot module4 "MongoDB, Mongoose schema/model, connection, and repeatable seeding"
          make_snapshot module5 "RESTful API integration and API-backed trip retrieval"
          make_snapshot module6 "Angular administrator SPA, reusable components/services, and CRUD"
          make_snapshot module7 "Administrator login, JWT authentication, and protected write endpoints"

          for branch in module1 module2 module3 module4 module5 module6 module7; do
            git switch main >/dev/null
            temp="build-$branch"
            git checkout --orphan "$temp" >/dev/null
            git rm -rf . >/dev/null 2>&1 || true
            rsync -a "/tmp/$branch/" ./
            rm -rf .github
            git add .
            git commit -m "CS 465 ${branch} checkpoint — Madison Parker" >/dev/null
            git push --force origin "HEAD:refs/heads/$branch"
            git switch main >/dev/null
            git branch -D "$temp" >/dev/null
          done

          git push --force origin main:refs/heads/final
