<div class="card trip-card shadow-sm">
  <div class="card-header fw-semibold">{{ trip.name }}</div>
  <img
    src="assets/images/{{ trip.image }}"
    [alt]="trip.name + ' thumbnail'"
    class="card-img-top">

  <div class="card-body d-flex flex-column">
    <h6 class="card-subtitle mb-2 text-muted">{{ trip.resort }}</h6>
    <p class="card-subtitle mt-2 mb-3 text-muted">
      {{ trip.length }} only {{ trip.perPerson | currency:'USD':'symbol' }} per person
    </p>
    <div class="card-text description-preview" [innerHTML]="trip.description"></div>

    <div *ngIf="isLoggedIn()" class="mt-auto pt-3 d-flex gap-2">
      <button
        type="button"
        class="btn btn-outline-primary btn-sm"
        (click)="editTrip(trip)">
        Edit Trip
      </button>
      <button
        type="button"
        class="btn btn-outline-danger btn-sm"
        [disabled]="deleting"
        (click)="deleteTrip(trip)">
        {{ deleting ? 'Deleting...' : 'Delete' }}
      </button>
    </div>
  </div>
</div>
