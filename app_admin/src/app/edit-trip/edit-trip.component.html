<div class="form-shell card shadow-sm">
  <div class="card-body">
    <h1 class="h3 text-center mb-4">Edit Trip</h1>

    <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

    <form *ngIf="editForm" [formGroup]="editForm" (ngSubmit)="onSubmit()">
      <div class="row g-3">
        <div class="col-md-6"><label for="code" class="form-label">Code</label><input id="code" type="text" formControlName="code" class="form-control" [readonly]="true" [ngClass]="{ 'is-invalid': submitted && f['code'].errors }"><div class="invalid-feedback">Trip code is required.</div></div>
        <div class="col-md-6"><label for="name" class="form-label">Name</label><input id="name" type="text" formControlName="name" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['name'].errors }"><div class="invalid-feedback">Name is required.</div></div>
        <div class="col-md-6"><label for="length" class="form-label">Length</label><input id="length" type="text" formControlName="length" class="form-control" placeholder="4 nights / 5 days" [ngClass]="{ 'is-invalid': submitted && f['length'].errors }"><div class="invalid-feedback">Length is required.</div></div>
        <div class="col-md-6"><label for="start" class="form-label">Start</label><input id="start" type="date" formControlName="start" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['start'].errors }"><div class="invalid-feedback">A start date is required.</div></div>
        <div class="col-md-6"><label for="resort" class="form-label">Resort</label><input id="resort" type="text" formControlName="resort" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['resort'].errors }"><div class="invalid-feedback">Resort is required.</div></div>
        <div class="col-md-6"><label for="perPerson" class="form-label">Per Person</label><input id="perPerson" type="text" formControlName="perPerson" class="form-control" placeholder="799.00" [ngClass]="{ 'is-invalid': submitted && f['perPerson'].errors }"><div class="invalid-feedback">Per-person price is required.</div></div>
        <div class="col-12"><label for="image" class="form-label">Image Name</label><input id="image" type="text" formControlName="image" class="form-control" placeholder="reef1.jpg" [ngClass]="{ 'is-invalid': submitted && f['image'].errors }"><div class="form-text">Use a file that already exists in src/assets/images.</div><div class="invalid-feedback">Image name is required.</div></div>
        <div class="col-12"><label for="description" class="form-label">Description</label><textarea id="description" rows="5" formControlName="description" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['description'].errors }"></textarea><div class="invalid-feedback">Description is required.</div></div>
      </div>
      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-info" [disabled]="saving">{{ saving ? 'Saving...' : 'Save Changes' }}</button>
        <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
