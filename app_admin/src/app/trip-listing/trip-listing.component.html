<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <div>
    <h1 class="h3 mb-1">Trip Administration</h1>
    <p class="text-muted mb-0">{{ message }}</p>
  </div>
  <button *ngIf="isLoggedIn()" type="button" class="btn btn-primary" (click)="addTrip()">
    Add Trip
  </button>
</div>

<div *ngIf="loading" class="alert alert-info">
  Loading trip data from the API...
</div>

<div class="row g-4" *ngIf="!loading">
  <div *ngFor="let trip of trips" class="col-12 col-md-6 col-lg-4">
    <app-trip-card
      [trip]="trip"
      (tripDeleted)="refreshTrips()">
    </app-trip-card>
  </div>
</div>
